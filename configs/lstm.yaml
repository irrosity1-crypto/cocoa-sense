# LSTM stretch model (docs/decisions.md D16). Added after the main final run, so it has its own
# development -> freeze -> final cycle and its own frozen file (configs/frozen_lstm.yaml).
# Everything in this file was fixed and committed BEFORE the LSTM was run on any data.
#
# Same task as the tree models: predict the h-month log return from the decision month, with
# split-conformal 80 % intervals. Grid searched by TimeSeriesSplit (gap = h) inside the
# training window; training start chosen afterwards on the 2016–2019 validation period.

input_sets:              # per-month input channels (names from features/build.py)
  - [ret_1m]             # returns only
  - [ret_1m, log_price]  # returns plus the price level
lookback: [12, 24]       # months in each input sequence
hidden_size: [8, 16]     # LSTM units (one layer, linear head)
epochs: 200              # full-batch Adam; fixed length, no early stopping
learning_rate: 0.01
weight_decay: 0.0001
n_seeds: 3               # independently seeded networks, predictions averaged
