[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cocoasense"
version = "0.1.0"
description = "CocoaSense AI: cocoa price forecasting and forward-sales decision support for Ghana (final-year project)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Helina", email = "helinadanzerl21@gmail.com" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=16",
    "openpyxl>=3.1",
    "requests>=2.32",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "statsmodels>=0.14.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "streamlit>=1.38",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.2"]

[project.scripts]
cocoasense = "cocoasense.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-requests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cocoasense"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "T20", "N", "RUF"]
ignore = ["N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["cocoasense", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"src/cocoasense/dashboard/pages/*" = ["N999"]
"notebooks/**" = ["T20", "E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["slow: tests that fit real models (deselect with -m 'not slow')"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore:.*No frequency information.*",
    "ignore:.*Non-invertible.*",
    "ignore:.*Non-stationary.*",
    "ignore:.*Maximum Likelihood optimization failed.*",
]

[tool.coverage.run]
source = ["src/cocoasense"]
omit = ["src/cocoasense/dashboard/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
